
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Form</title>
</head>
<body>

<h1 th:text="${book.id == null} ? 'Add New Book' : 'Edit Book'">
    Book Form
</h1>

<form th:action="@{/books/save}"
      th:object="${book}"
      method="post"
      enctype="multipart/form-data"
      novalidate>

    <input type="hidden" th:field="*{id}">

    <label for="title">Title:</label>

    <input type="text"
           id="title"
           th:field="*{title}"
           required>

    <div th:if="${#fields.hasErrors('title')}"
         th:errors="*{title}"
         style="color:red">
    </div>

    <br><br>

    <label for="isbn">ISBN:</label>

    <input type="text"
           id="isbn"
           th:field="*{isbn}"
           required>

    <div th:if="${#fields.hasErrors('isbn')}"
         th:errors="*{isbn}"
         style="color:red">
    </div>

    <br><br>

    <label for="publicationYear">
        Publication Year:
    </label>

    <input type="number"
           id="publicationYear"
           th:field="*{publicationYear}"
           min="1450"
           max="2100"
           required>

    <div th:if="${#fields.hasErrors('publicationYear')}"
         th:errors="*{publicationYear}"
         style="color:red">
    </div>

    <br><br>

    <label for="author">Author:</label>

    <select id="author"
            th:field="*{author.id}"
            required>

        <option value="">Select an author</option>

        <option th:each="author : ${authors}"
                th:value="${author.id}"
                th:text="${author.name}">
        </option>

    </select>

    <div th:if="${#fields.hasErrors('author')}"
         th:errors="*{author}"
         style="color:red">
    </div>

    <br><br>

    <label>Categories:</label>

    <div th:each="category : ${categories}">

        <input type="checkbox"
               name="categoryIds"
               th:id="${'category-' + category.id}"
               th:value="${category.id}"
               th:checked="${selectedCategoryIds.contains(category.id)}">

        <label th:for="${'category-' + category.id}"
               th:text="${category.name}">
        </label>

    </div>

    <br><br>

    <label for="coverFile">Book Cover:</label>

    <input type="file"
           id="coverFile"
           name="coverFile"
           accept="image/png,image/jpeg">

    <p>Allowed formats: JPG, PNG (maximum 5 MB)</p>

    <div th:if="${book.coverImagePath != null
                 and !book.coverImagePath.isEmpty()}">

        <p>Current Cover:</p>

        <img th:src="@{/{path}(path=${book.coverImagePath})}"
             alt="Current Book Cover"
             width="120">

        <p>
            Choose a new image above to replace this cover.
        </p>

    </div>

    <br>

    <button type="submit">Save Book</button>

</form>

<br>

<a th:href="@{/books}">Back to Books</a>

</body>
</html>
