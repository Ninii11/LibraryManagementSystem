
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Books</title>
</head>
<body>

<h1>Library Books</h1>

<a th:href="@{/books/new}">Add New Book</a>
<br><br>

<form th:action="@{/books/search}" method="get">
    <input type="text"
           name="title"
           placeholder="Search by title">

    <button type="submit">Search</button>
</form>

<br>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>ISBN</th>
        <th>Publication Year</th>
        <th>Author</th>
        <th>Cover</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="book : ${books}">

        <td th:text="${book.id}"></td>

        <td th:text="${book.title}"></td>

        <td th:text="${book.isbn}"></td>

        <td th:text="${book.publicationYear}"></td>

        <td th:text="${book.author.name}"></td>

        <td>
            <img th:if="${book.coverImagePath != null
                         and !book.coverImagePath.isEmpty()}"
                 th:src="@{/{path}(path=${book.coverImagePath})}"
                 alt="Book Cover"
                 width="70">

            <span th:if="${book.coverImagePath == null
                          or book.coverImagePath.isEmpty()}">
                No cover
            </span>
        </td>

        <td>
            <a th:href="@{/books/edit/{id}(id=${book.id})}">
                Edit
            </a>

            <form th:action="@{/books/delete/{id}(id=${book.id})}"
                  method="post"
                  style="display:inline;">

                <button type="submit">Delete</button>

            </form>
        </td>

    </tr>
    </tbody>
</table>

<br>

<div th:if="${totalPages > 1}">

    <a th:if="${currentPage > 0}"
       th:href="@{/books(page=${currentPage - 1},size=5)}">
        Previous
    </a>

    <span th:text="${currentPage + 1}"></span>
    /
    <span th:text="${totalPages}"></span>

    <a th:if="${currentPage + 1 < totalPages}"
       th:href="@{/books(page=${currentPage + 1},size=5)}">
        Next
    </a>

</div>

<br>

<a th:href="@{/authors}">View Authors</a>

<br><br>

<a th:href="@{/categories}">View Categories</a>

</body>
</html>
