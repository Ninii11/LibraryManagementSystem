
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Authors</title>
</head>
<body>

<h1>Authors</h1>

<div th:if="${errorMessage}"
     th:text="${errorMessage}"
     style="color:red; margin-bottom:15px;">
</div>

<div th:if="${successMessage}"
     th:text="${successMessage}"
     style="color:green; margin-bottom:15px;">
</div>

<a th:href="@{/authors/new}">Add New Author</a>

<br><br>

<form th:action="@{/authors/search}" method="get">

    <input type="text"
           name="name"
           placeholder="Search author">

    <button type="submit">Search</button>

</form>

<br>

<table border="1" cellpadding="8">

    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="author : ${authors}">

        <td th:text="${author.id}"></td>

        <td th:text="${author.name}"></td>

        <td th:text="${author.email}"></td>

        <td>
            <a th:href="@{/authors/edit/{id}(id=${author.id})}">
                Edit
            </a>

            <!-- Delete Author -->
            <form th:action="@{/authors/delete/{id}(id=${author.id})}"
                  method="post"
                  style="display:inline;">

                <button type="submit">Delete</button>

            </form>
        </td>

    </tr>

    </tbody>

</table>

<br><br>

<a th:href="@{/books}">Back to Books</a>

</body>
</html>
